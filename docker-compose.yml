version: '3.8'

services:
  # ==========================================
  # خادم قاعدة بيانات PostgreSQL
  # ==========================================
  manarasy-db:
    image: postgres:15-alpine
    container_name: manarasy-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./backend/.env.prod
    volumes:
      - manarasy_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-privileges.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - manarasy-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-manara_user} -d $${POSTGRES_DB:-manara_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==========================================
  # Redis (داخلي فقط): عدّادات القفل، إبطال الجلسات، الكاش المشترك بين الـ workers
  # ==========================================
  manarasy-redis:
    image: redis:7-alpine
    container_name: manarasy-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - manarasy-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # خادم التطبيق الخلفي (Django / DRF)
  # ==========================================
  manarasy-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: manarasy-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      REDIS_URL: redis://manarasy-redis:6379/1
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
    volumes:
      - manarasy_static:/app/staticfiles
      - manarasy_media:/app/media
      # إيصالات الدفع: مجلد خاص لا يُركَّب في حاوية Nginx إطلاقاً
      - manarasy_private:/app/private_media
    networks:
      - manarasy-internal
      - proxy
    depends_on:
      manarasy-db:
        condition: service_healthy
      manarasy-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      # التوجيه الآمن لواجهة البرمجة عبر النطاق المخصص
      - "traefik.http.routers.manarasy-api.rule=Host(`api.manarasy.io`)"
      - "traefik.http.routers.manarasy-api.entrypoints=websecure"
      - "traefik.http.routers.manarasy-api.tls.certresolver=myresolver"
      - "traefik.http.services.manarasy-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.manarasy-api.priority=100"
      - "traefik.http.routers.manarasy-api.middlewares=manarasy-api-ratelimit,manarasy-api-inflight,manarasy-sec-headers"
      - "traefik.http.middlewares.manarasy-api-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.manarasy-api-ratelimit.ratelimit.burst=100"
      - "traefik.http.middlewares.manarasy-api-ratelimit.ratelimit.period=1s"
      - "traefik.http.middlewares.manarasy-api-inflight.inflightreq.amount=100"
      - "traefik.http.middlewares.manarasy-sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.manarasy-sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.manarasy-sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.manarasy-sec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.manarasy-sec-headers.headers.referrerPolicy=same-origin"
      - "traefik.docker.network=proxy"

  # ==========================================
  # خادم الواجهة الأمامية (React SPA + Nginx)
  # ==========================================
  manarasy-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: manarasy-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - manarasy_static:/usr/share/nginx/static:ro
      - manarasy_media:/usr/share/nginx/media:ro
    networks:
      - proxy
    depends_on:
      - manarasy-backend
    labels:
      - "traefik.enable=true"
      # توجيه النطاق الرئيسي والنطاقات الفرعية للمساجد (*.manarasy.io)
      - "traefik.http.routers.manarasy-web.rule=Host(`manarasy.io`, `www.manarasy.io`) || HostRegexp(`{subdomain:[a-z0-9-]+}.manarasy.io`)"
      - "traefik.http.routers.manarasy-web.entrypoints=websecure"
      - "traefik.http.routers.manarasy-web.middlewares=manarasy-web-ratelimit"
      - "traefik.http.middlewares.manarasy-web-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.manarasy-web-ratelimit.ratelimit.burst=200"
      - "traefik.http.routers.manarasy-web.tls.certresolver=myresolver"
      - "traefik.http.services.manarasy-web.loadbalancer.server.port=80"
      # إعادة توجيه HTTP إلى HTTPS تلقائياً
      - "traefik.http.routers.manarasy-web-http.rule=Host(`manarasy.io`, `www.manarasy.io`) || HostRegexp(`{subdomain:[a-z0-9-]+}.manarasy.io`)"
      - "traefik.http.routers.manarasy-web-http.entrypoints=web"
      - "traefik.http.routers.manarasy-web-http.middlewares=manarasy-redirect-https"
      - "traefik.http.middlewares.manarasy-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.manarasy-redirect-https.redirectscheme.permanent=true"

# ==========================================
# وحدات التخزين المشتركة والمعزولة
# ==========================================
volumes:
  manarasy_postgres_data:
    name: manarasy_postgres_data
  manarasy_static:
    name: manarasy_static
  manarasy_media:
    name: manarasy_media
  manarasy_private:
    name: manarasy_private

# ==========================================
# الشبكات: شبكة وسيط Traefik وشبكة معزولة للبيانات
# ==========================================
networks:
  manarasy-internal:
    name: manarasy-internal
  proxy:
    external: true
