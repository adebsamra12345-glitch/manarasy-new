server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # الحماية والترويسات الأمنية المتقدمة
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy: وضع المراقبة (Report-Only) أولاً حتى لا يُكسر شيء في الإنتاج.
    # راقب أخطاء Console لأسبوع، ثم بدّل الاسم إلى Content-Security-Policy لتفعيلها.
    # style 'unsafe-inline' مطلوب لأن الواجهة تستخدم أنماط inline؛ السكربتات بلا unsafe-inline.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.manarasy.io https://*.manarasy.com; connect-src 'self' https://api.manarasy.io https://*.manarasy.io https://*.manarasy.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # خدمة الملفات الثابتة لـ Django المشتركة عبر Volume
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # خدمة ملفات الوسائط وشعارات المساجد المشتركة عبر Volume
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # تخزين ملفات Vite الثابتة (JS/CSS/Fonts) في الكاش
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # التوجيه الافتراضي لدعم مسارات React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
