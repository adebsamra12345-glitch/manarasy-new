server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # الحماية والترويسات الأمنية المتقدمة
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # خدمة الملفات الثابتة لـ Django المشتركة عبر Volume
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # خدمة ملفات الوسائط وشعارات المساجد المشتركة عبر Volume
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # تخزين ملفات Vite الثابتة (JS/CSS/Fonts) في الكاش
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # التوجيه الافتراضي لدعم مسارات React Router (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
