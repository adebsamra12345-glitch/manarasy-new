# ==========================================
# بيئة الاستدلال والصوت لمنصة منارة (GPU Node - adebserver)
# الكرت: NVIDIA RTX 5070 Ti (16GB VRAM)
# المستخدم من خدمات أخرى: ~6.4GB
# vLLM 0.33 أزال bitsandbytes: نستخدم FP8 online (Qwen3-8B ~9GB أوزان) مع gpu-memory-utilization=0.80 (~12.4GB)
# يتطلب كرتاً شبه مخصص (لا يتعايش مع خدمات أخرى تستهلك ~6.4GB)
# ==========================================

services:
  llm:
    image: vllm/vllm-openai:latest
    container_name: manarasy-vllm
    runtime: nvidia
    ipc: host
    restart: unless-stopped
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - PYTHONPATH=/plugins
    command: >
      --model /models/Qwen3-8B
      --served-model-name base
      --quantization fp8
      --gpu-memory-utilization 0.80
      --max-model-len 4096
      --max-num-seqs 4
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --enable-lora
      --max-lora-rank 32
      --logits-processors cjk_ban:CjkBanLogitsProcessor
      ${LORA_ARGS:-}
    ports:
      - "${TS_IP:?يجب ضبط TS_IP بعنوان Tailscale حصراً}:8000:8000"
    volumes:
      - "${MODELS_DIR:?يجب ضبط مسار النماذج MODELS_DIR}:/models:ro"
      - "./loras:/loras"
      - "./vllm_plugins:/plugins:ro"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  stt:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: manarasy-stt
    volumes:
      - "${MODELS_DIR}/.cache:/root/.cache/huggingface"
    runtime: nvidia
    restart: unless-stopped
    depends_on:
      llm:
        condition: service_healthy
    environment:
      - WHISPER__MODEL=deepdml/faster-whisper-large-v3-turbo-ct2
      # CUDA 12.2 في الصورة لا يدعم Blackwell (cuBLAS NOT_SUPPORTED مع int8_float16)؛ float16 يعمل لكنه يترك هامشاً 1.5GB فقط.
      # لذلك STT على CPU (int8) للحفاظ على ذاكرة الكرت لـ vLLM.
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__TTL=-1
    ports:
      - "${TS_IP:?يجب ضبط TS_IP بعنوان Tailscale حصراً}:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

